# RAE 2822 Case 9 · transonic airfoil SBLI gold standard (P4 V73.A · DEC-V61-238)
#
# WHY THIS ANCHOR (civil-aircraft scope mandate, 2026-06-10)
# ----------------------------------------------------------
# RAE 2822 Case 9 is THE canonical transonic-cruise validation case for
# civil-aircraft aerodynamics (supercritical airfoil, attached shock/boundary-
# layer interaction — the physics regime of every modern airliner wing at
# cruise). It closes capability-matrix §6 gap#2: the existing NACA0012 M=0.8
# anchor sits "just below shock-formation threshold", so shock capture on a
# lifting surface has never been judged. Source spec: B109 substrate research
# (.planning/case_profiles/V67A_substrate_research/
# B108_to_B112_substrate_research_batched.md).
#
# OPERATING POINT — RESOLVED V73.B (DEC-V61-240)
# ----------------------------------------------
# The literature carries TWO operating points for Case 9 (loop-auditor F4):
#   nominal (wind-tunnel as-run):       M = 0.730, alpha = 3.19 deg
#   wall-interference corrected (CFD):  M = 0.734, alpha = 2.79 deg
# This file pins the CORRECTED point — cross-confirmed V73.B as the dominant
# free-air CFD convention (HiOCFD workshop case C2.2; arXiv:1302.2132; NPARC
# validation archive all use M=0.734/alpha=2.79/Re=6.5e6; B109's mixed form
# M=0.730/alpha=2.79 matches no source and is superseded). Adopted
# autonomously under the sponsor's standing development mandate (2026-06-10),
# recorded in DEC-V61-240; sponsor retains override. Tier-1 gates judge
# CONSISTENCY (case == this declaration), which is convention-independent.
#
# TWO-TIER ORACLE (enforcement rules live in src/transonic_airfoil_gate.py)
# -------------------------------------------------------------------------
# Tier 1 SANITY (always enforced, closed-form, re-derived in tests):
#   C0a/C0b/C0c freestream Mach/alpha/Re three-way consistency (measured
#   solved-field probe ~ declared 0/ BCs ~ this file's target)
#   C1 stagnation ceiling     max Cp in [1.0, Cp_stag + margin]
#   C2 vacuum floor           min Cp > -2/(gamma M^2)
#   C3 supersonic pocket      min upper-surface Cp < Cp* (Case 9 is ABOVE
#                             shock-formation threshold — that's the point)
#   C4 shock in (0.2, 0.9) x/c with plateau/jump/crossing detector guards
#   C5 force ranges           Cl in (0,2), Cd in (0,0.1)
#   C6 Cl cross-check         contour-integrated Cl_p vs forceCoeffs Cl_fc
# Tier-1 pass == SANITY-PASS. NOT validation. NOT coverage evidence.
#
# Tier 2 experimental anchor: role-aware candidates (cl + shock_xc ENFORCED,
# cd ADVISORY — turbulence-model-dependent viscous drag is reported, never
# judged; Cp(x/c) profile band is PROFILE-PENDING, a future QoI). Values
# NUMERIZED in V73.B per the pre-registered V73.A criterion ("digitized from
# AGARD AR-138 ... OR a trusted reproduction (NPARC/CFL3D archives)"):
# Cl=0.803 and Cd=0.0168 are the experimental values as carried by the NPARC
# validation archive and arXiv:1302.2132; shock x/c=0.525 is the TABULATED
# experimental shock location (the ~0.55 figure circulating in prose is a
# plot-reading approximation — V73.A research note). HONESTY BOUNDARY: the
# primary AGARD AR-138 report PDF was NOT directly digitized; verification
# rests on three independent secondary carriers agreeing to the quoted
# precision (see provenance). cd stays ADVISORY: fully-turbulent (no-trip)
# RANS overpredicts Case 9 drag — reported, never judged.
#
# COVERAGE: this is a BREADTH anchor on the already-covered kOmegaSST
# COMP-STEADY cell (wedge V71). Nothing in this file or its gate can flip
# runnable-coverage 3 -> 4.

quantity: transonic_airfoil_sbli
operating_point:
  mach: 0.734
  alpha_deg: 2.79
  reynolds: 6.5e+6   # signed exponent: YAML 1.1 parses '6.5e6' as a string
  chord_m: 1.0
  gamma: 1.4
  r_specific_J_kgK: 287.058
operating_point_verification: CROSS-CONFIRMED-SECONDARY  # informational; tier-1 consistency gates do not consume this
operating_point_adjudication: "corrected point (M=0.734, alpha=2.79) adopted DEC-V61-240 under sponsor standing mandate 2026-06-10; cross-confirmed HiOCFD C2.2 + arXiv:1302.2132 + NPARC archive; sponsor may override"

tolerances:
  mach_atol: 0.005          # C0a: |M_meas - M_decl|, |M_meas - M_gold|
  alpha_atol_deg: 0.2       # C0b: incidence direction gate
  reynolds_rtol: 0.10       # C0c: rough wrong-fluid catch (declared-side)
  stagnation_margin: 0.05   # C1: max Cp <= Cp_stag(M_meas) + this
  shock_band: [0.2, 0.9]    # C4: physically plausible shock x/c window
  cl_range: [0.0, 2.0]      # C5
  cd_range: [0.0, 0.1]      # C5
  cl_crosscheck_rtol: 0.05  # C6: |Cl_p - Cl_fc| / Cl_fc

tier2_anchor:
  anchor_verification: VERIFIED
  provenance:
    # `source` + `digitization` are the gate-consumed keys (seam contract,
    # src/transonic_airfoil_gate.py _tier2_mode); the rest is detail
    source: "AGARD AR-138 (Cook, McDonald & Firmin 1979), RAE 2822 Case 9, wall-interference-corrected convention — via 3 independent secondary carriers (see carriers)"
    digitization: "numerized 2026-06-10 (V73.B, DEC-V61-240) per the pre-registered V73.A criterion accepting trusted reproductions; HONESTY BOUNDARY: primary AGARD AR-138 PDF not directly digitized — verification rests on 3 carriers agreeing"
    carriers:
      - "NPARC Alliance validation archive, RAE 2822 transonic airfoil case page (experimental Cl/Cd for Case 9)"
      - "arXiv:1302.2132 (RAE 2822 grid-convergence study; quotes AGARD tabulated values incl. shock x/c)"
      - "HiOCFD workshop case C2.2 definition (operating point + reference values)"
  candidates:
    - qoi: cl
      role: ENFORCED
      value: 0.803           # experimental lift, corrected point
      rel_tol: 0.05
    - qoi: shock_xc
      role: ENFORCED
      value: 0.525           # TABULATED experimental shock x/c (not the ~0.55 prose figure)
      atol: 0.05
    - qoi: cd
      role: ADVISORY
      value: 0.0168          # reported only; never part of tier2_passed
      rel_tol: 0.15

case_info:
  id: rae2822_case9
  validation_status: LIVE_PROBE_V73B
  benchmark: "AGARD AR-138 (Cook, McDonald & Firmin 1979) — RAE 2822 pressure distributions and boundary-layer measurements, Case 9"
  solver_plan: "PRIMARY rhoSimpleFoam + kOmegaSST + Sutherland (ESI 2312, probed native arm64 2026-06-10); FALLBACK rhoCentralFoam pseudo-transient (M6-divergence lessons V27-V29)"
  geometry: "RAE 2822 supercritical airfoil, chord 1.0 m, 2D (thin span), y+ <= 1 target per B109"
