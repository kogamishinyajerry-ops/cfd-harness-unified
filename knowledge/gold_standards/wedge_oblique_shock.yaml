# Gold Standard — Supersonic Wedge Oblique Shock (M1=2.0, theta=15 deg, inviscid)
# ========================================================================
# P4 V71.A (DEC-V61-232, scaffolding-first 2026-06-07). The FIRST compressible /
# density-based / shock-capturing coverage benchmark — the anchor that closes the
# capability-matrix "rhoCentralFoam wired in advisor surface but no anchor case"
# gap (V71.A). Chosen because its reference is ANALYTICALLY EXACT: every observable
# is a CLOSED-FORM function of (M1, theta, gamma) via the oblique-shock theta-beta-M
# + normal-shock relations — the single most important honesty property for a
# coverage gate (cf. lid_driven_cavity.yaml: Phase-0 fabricated values were caught
# only at real-solver time; we do not repeat that). Reference values here are NOT
# transcribed from a table — they are re-derived from `case_info.wedge_inputs` by
# `tests/p4/test_wedge_oblique_shock_gold.py`, which fails if any committed value
# drifts from the formula. The benchmark cannot be silently fabricated or
# engineered-to-pass.
#
# Closed form (Anderson, Modern Compressible Flow, 3rd ed., Ch. 4; NACA Report 1135):
#     theta-beta-M:  tan(theta) = 2 cot(beta) (M1^2 sin^2 beta - 1)
#                                  / (M1^2 (gamma + cos 2 beta) + 2)     [weak root]
#     M1n = M1 sin(beta)
#     p2/p1   = 1 + 2 gamma/(gamma+1) (M1n^2 - 1)
#     rho2/rho1 = (gamma+1) M1n^2 / ((gamma-1) M1n^2 + 2)
#     T2/T1   = (p2/p1) / (rho2/rho1)
#     M2n     = sqrt( (1 + (gamma-1)/2 M1n^2) / (gamma M1n^2 - (gamma-1)/2) )
#     M2      = M2n / sin(beta - theta)
# with M1=2.0, gamma=1.4, theta=15 deg  ->
#     beta = 45.3436 deg, M2 = 1.4457, p2/p1 = 2.1947, rho2/rho1 = 1.7289,
#     T2/T1 = 1.2694   (derivation re-run in the test)
#
# CONTRACT STATUS — `ANALYTICAL_REFERENCE_AUTHORED · LIVE_RUN_PENDING`:
#   This slice (DEC-V61-232) authors the contract + a self-verifying derivation
#   test + a PURE anti-tautology extractor + a fail-closed Control-plane gate, and
#   proves the gate fails-closed on doctored inputs via an offline SYNTHETIC fixture
#   (reports/showcase_aero/_w71a_wedge_probe_SYNTHETIC/ — NOT a solver run, labeled
#   as such). It does NOT flip runnable-coverage 2->3: that requires a LIVE
#   rhoCentralFoam solve, which is blocked on an ESI image (DEC-V61-224 fork wall)
#   and deferred to a separate gated slice. tolerance=0.03 (3%) per the eval E22
#   signature; the analytical reference + sharp (non-smeared) discontinuity make a
#   tight gate honest.
#
# SCOPE CAVEAT: the closed form is exact for INVISCID flow with a sharp oblique
# shock. The gate validates a density-based shock-capturing solver against this
# exact reference. Viscous shock smearing / boundary-layer effects are out of scope
# (they would forfeit the self-verifiability that justifies an analytical gold).

quantity: shock_angle_beta_deg
reference_values:
  - value: 45.3436
    unit: degrees
    description: "weak-shock beta from theta-beta-M, M1=2.0 theta=15 gamma=1.4 (Anderson Ch.4)"
tolerance: 0.03
source: "Anderson, Modern Compressible Flow 3rd ed. Ch.4 (oblique shock theta-beta-M relation); NACA Report 1135. Reference is closed-form, re-derived in test (analytical, not experimental)."
literature_doi: "ISBN-9780072424430"
mesh_info:
  cells: 0  # LIVE_RUN_PENDING — no mesh anchored yet (scaffolding slice)
  type: structured
solver_info:
  name: rhoCentralFoam  # density-based explicit central-upwind (Kurganov-Tadmor) — LIVE_RUN_PENDING
  schemes: explicit-central-upwind
case_info:
  id: wedge_oblique_shock
  flow_type: EXTERNAL
  geometry_type: SUPERSONIC_WEDGE
  steady_state: STEADY
  radiation: false
  wedge_inputs:           # the SOLE source of the reference values (self-verified)
    M1: 2.0               # freestream Mach number
    theta_deg: 15.0       # wedge half-angle (flow deflection)
    gamma: 1.4            # ratio of specific heats (air)
    R_specific: 287.058   # J/(kg.K) air — context for the ideal-gas consistency gate
    x_shock_station: 0.5  # m, x-coord (from apex) of the vertical density sample line
    beta_validity_min_deg: 30.0  # Mach angle asin(1/M1)=30 deg — beta must exceed this
    freestream_probe: freestream # surfaceFieldValue region (areaAverage p,rho,T,Ma upstream)
    postshock_probe: postShock   # surfaceFieldValue region (areaAverage p,rho,T,Ma post-shock)
    shock_line: shockLine        # sampled rho(distance) line crossing the shock

