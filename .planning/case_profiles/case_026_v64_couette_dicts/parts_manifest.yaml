# case_026 · parts_manifest · minimal stub
#
# 2D plane-Couette channel · blockMesh-native (no STL · 4 patch faces).
# Geometry is fully described in system/blockMeshDict (single hex block).
# Companion to case_025 plane Poiseuille (B68); this one is 1D LINEAR shear-driven
# (no pressure gradient · u(y) = U_top · y/H is even simpler than parabolic).

case_id: case_026_plane_couette_channel
schema_version: 1
geometry_mode: blockMesh_native
last_assessed: "2026-05-15"
last_assessed_by: "Claude Code Opus 4.7 (V64-A B69 dispatch · M-V64A-VAL-FULL-COUETTE)"

# No STL parts — plane Couette is 6 quad faces (top movingWall + bottom noSlip + inlet/outlet + 2 empty).
parts: []

patches:
  - name: inlet
    role: velocity_inlet_linear_coded
    blockmesh_patch: inlet
    location: "x = 0, y ∈ [0, H] · codedFixedValue linear profile u(y) = U_top · y/H"
  - name: outlet
    role: pressure_outlet_fixed_zero
    blockmesh_patch: outlet
    location: "x = L = 0.5, y ∈ [0, H] · p = 0 fixedValue · U zeroGradient"
  - name: topWall
    role: moving_wall
    blockmesh_patch: topWall
    location: "y = H = 0.01, x ∈ [0, L] · movingWallVelocity U = (0.1, 0, 0)"
  - name: bottomWall
    role: no_slip_wall
    blockmesh_patch: bottomWall
    location: "y = 0, x ∈ [0, L] · noSlip"
  - name: frontAndBack
    role: empty_2d
    blockmesh_patch: [frontAndBack]
    location: "z = 0 and z = z_thick = 0.001 · 2D empty patches"

risk_flags:
  - flag_id: executable_smoke_test
    triggered: true
    justification: |
      First plane-Couette substrate in repo. Analytical 1D LINEAR canonical
      (one degree simpler than B68 plane Poiseuille parabolic) · Δ < 0.5%
      expected for laminar simpleFoam on a reasonable uniform-y mesh.
  - flag_id: solver_stability_on_novel_geometry
    triggered: false
    justification: |
      Plane Couette is THE simplest analytical canonical · machine-precision
      analytical solution u(y) = U_top · y/H · zero literature dispute.
  - flag_id: inlet_bc_developed_profile
    triggered: false
    justification: |
      Inlet uses codedFixedValue with the analytical linear profile · the
      inlet IS the analytical solution · no entrance development needed.
      Backup uniform-inlet path: L = 50·H = 0.5 m provides ≥3× entrance-
      length buffer (L_entrance ≈ 0.06·Re·H = 0.04 m for Re_h=66.7).

tolerance_policy:
  u_profile_centerline_to_walls:
    canonical: "u(y) = U_top · y/H"
    canonical_source: "Schlichting H. (2017). Boundary-Layer Theory, 9th ed. Springer §5.1.0 (Couette flow); also White F.M. (2016). Viscous Fluid Flow, 3rd ed. McGraw-Hill §3.2.1"
    tolerance_strict_full: 0.01   # max |Δu| < 1% across 17+ y-points (of U_top)
    tolerance_marginal:    0.03   # max |Δu| ∈ [1%, 3%]
  dp_dx_kinematic:
    canonical: 0.0   # m²/s²/m  · pure shear-driven · ZERO pressure gradient
    canonical_source: "Schlichting H. (2017) §5.1.0; pure Couette is dp/dx = 0 (Couette–Poiseuille hybrid is out of scope)"
    tolerance_strict_full: "abs(slope_fit) < 1e-4 · effectively zero · sanity cross-check, not strict trifecta"
  wall_shear_stress_kinematic:
    canonical: 1.5e-5  # m²/s²  · = ν · U_top / H · constant gradient analytical
    canonical_source: "Schlichting H. (2017) §5.1.0 (du/dy = U_top/H constant → τ_w = μ·U_top/H = ν·U_top/H kinematic)"
    tolerance_strict_full: 0.01   # |Δ| < 1% on τ_w (strict trifecta cross-check)
