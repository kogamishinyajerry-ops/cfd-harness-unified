      Mitigation: full Docker invocation captured in RUN_LOG.md.
  - flag_id: solver_stability_on_novel_geometry
    triggered: false
    justification: |
      ZPG turbulent BL + kOmegaSST + bounded-upwind is the canonical
      reference topology for NASA TMR. Zero novel-geometry risk.

