[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdtrust"
version = "0.0.1"
description = "AI-CFD-V2 Phase 0 trust harness — case contracts, audits, and trust reports for OpenFOAM-based CFD cases."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "AI-CFD-V2 project" }]
keywords = ["cfd", "openfoam", "trust", "validation", "ai-advisor"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
cfdtrust = "cfdtrust.cli:main"

[tool.setuptools.packages.find]
# Post-merge (DEC-V61-201): cfdtrust/ is a top-level package inside the
# audit subsystem; the AI-CFD-V2 `src/` middle layer was flattened.
where = ["."]
include = ["cfdtrust*"]
exclude = ["cfdtrust_tests*", "tools*", "cases*", "docs*"]

[tool.setuptools.package-data]
"cfdtrust.schemas" = ["*.json"]

[tool.pytest.ini_options]
# Post-merge (DEC-V61-201): tests live in cfdtrust_tests/ (renamed from
# tests/ to avoid clash with cfd-harness-unified's ui/backend/tests/);
# importable code lives directly at the audit subsystem root, no src/.
testpaths = ["cfdtrust_tests"]
pythonpath = ["."]
addopts = "-q"
