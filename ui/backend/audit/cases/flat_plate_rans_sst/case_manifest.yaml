# AI-CFD-V2 sample case manifest — flat plate, steady incompressible RANS, k-omega SST.
# Phase 0: structural completeness only. Real reference data is NOT finalized.

case_id: flat_plate_rans_sst
case_family: canonical_rans_verification
# DEC-V61-209 (2026-05-27): flipped mocked -> openfoam. The OpenFOAM backend
# (cfdtrust/backends/openfoam.py) is implemented and proven by
# channel_flow_rans_sst (overall=PASS, real, validated). This re-routes
# solver.execute() to the real Docker simpleFoam path AND unlocks the real
# NASA TMR Cf(x) reference comparison (qoi.py:118 gate). The verdict is now
# the honest V&V signal, not a Phase-0 mock.
solver_backend: openfoam
solver: simpleFoam

physics:
  regime: steady_incompressible_RANS
  fluid: generic_air
  turbulence_model: kOmegaSST
  compressible: false
  steady: true

geometry_contract:
  required_patches:
    - inlet
    - outlet
    - wall
    - top
    - frontAndBack
  dimensionality: "2.5D"
  unit_system: SI

mesh_contract:
  checkmesh_required: true
  boundary_layer_required: true
  y_plus_target:
    min: 0.5
    max: 5.0
    wall_function_policy: low_re_resolved
  quality_thresholds:
    max_non_orthogonality: 65
    max_skewness: 4.0
    max_aspect_ratio: 1000

bc_contract:
  inlet:
    velocity: { type: fixedValue, magnitude_m_s: 30.0 }
    pressure: { type: zeroGradient }
    # DEC-V61-209 cycle-3g: match NASA TMR SST freestream EXACTLY. Prior
    # intensity=0.01 (Tu=1%) gave k=0.135, omega=67 -> mu_t/mu ~ 336, ~600x
    # NASA's freestream turbulence — a genuine setup error worth fixing. NASA
    # values: Tu=0.039%, mu_t/mu=0.009 -> k = 1.125*U^2/Re_L = 1.125*900/5e6 =
    # 2.025e-4, omega = 125*U/L = 3750 (mu_t/mu = k/(omega*nu) = 0.009).
    # HONEST RESULT: fixing this only MARGINALLY reduced the near-LE error
    # (worst point 21.75% -> 21.23%, fails 5 -> 4). So the freestream was NOT
    # the dominant cause (Codex's leading hypothesis, tested + largely refuted).
    # The residual near-LE over-prediction (0.01 < x < 0.027) survives correct
    # Re + NASA topology + NASA freestream + y+~1 + grid refinement -> it is a
    # near-LE OpenFOAM-kOmegaSST-vs-CFL3D formulation discrepancy (TMR documents
    # OpenFOAM SST historically not matching CFL3D's SST near the LE). See DEC-209.
    k: { type: fixedValue, value: 2.025e-4 }
    omega: { type: fixedValue, value: 3750.0 }
  outlet:
    pressure: { type: fixedValue, value_Pa: 0.0 }
    velocity: { type: zeroGradient }
  wall:
    velocity: { type: noSlip }
    k: { type: kqRWallFunction }
    omega: { type: omegaWallFunction }
  turbulence_fields:
    - k
    - omega
    - nut

solver_contract:
  residual_targets:
    Ux: 1.0e-5
    Uy: 1.0e-5
    p: 1.0e-5
    k: 1.0e-5
    omega: 1.0e-5
  max_iterations: 500
  qoi_stability:
    window_iterations: 50
    relative_drift_tolerance: 1.0e-3

qoi:
  - name: skin_friction_coefficient
    kind: line_distribution
    units: dimensionless
    tolerance: 0.05
  - name: drag_force
    kind: scalar
    units: N
    tolerance: 0.05

reference_comparison:
  status: finalized
  source: NASA TMR 2D flat plate, SST, CFL3D solution
  source_url: https://tmbwg.github.io/turbmodels/flatplate_sst.html
  # SHA-256 of the ORIGINAL NASA tecplot file (cf_plate_sstv.dat).
  source_sha256: a56bd2d16818456af015b13839f0a991b4b85bfa6c18242e7c331a2c7a4d40e8
  reference_csv: reference/cf_reference.csv
  # R16-F-01 fix: SHA-256 of the in-repo derived CSV that the gate actually
  # reads. Verified at load time — refuses to compare against tampered
  # reference data (e.g. a swapped curve that would make our run silently
  # PASS).
  reference_csv_sha256: 48eb163b4d56a390c87e4085d763a612697c65c7504e6470348e628bb9d21f2c
  qoi: skin_friction_coefficient
  tolerance: 0.10
  # 0.01 = NASA TMR's OWN documented leading-edge exclusion (TMR notes local
  # anomalous SST activation in 0 < x < 0.01). REVERTED from a rationalized
  # 0.03 (DEC-V61-209 cycle-3e/f) after Codex flagged it as post-hoc gate
  # movement: failures persisted to x~0.027, and moving the cutoff to 0.03 to
  # clear them was masking, not scoping. cycle-3g keeps NASA's 0.01 and reports
  # the HONEST verdict (currently FAIL on 4 near-LE points, see notes). The
  # gate-definition question (per-point-from-0.01 vs NASA's own integrated-drag
  # / downstream-Cf convention) is escalated to the sponsor — NOT tuned to pass.
  x_min_compare_m: 0.01
  # DEC-V61-209 ADDENDUM 3 (sponsor-approved gate definition, option B):
  # gate on NASA TMR's OWN verification convention — integrated skin-friction
  # drag + Cf at the downstream station x=0.97008 — instead of an arbitrary
  # per-point-from-x=0.01 rule. The per-point near-LE deviations (the
  # OpenFOAM-kΩSST-vs-CFL3D leading-edge discrepancy) are still computed,
  # written to reference_comparison.csv, and reported as known_deviations —
  # demoted to informational, NOT excluded and NOT hidden.
  gate_mode: nasa_integrated
  verification_station_m: 0.97008
  # DEC-V61-209 ADDENDUM 5 (Codex R0 caveat): developed-region per-point shape
  # guard. Integrated drag + a single station cannot, on their own, reject a
  # shape-wrong Cf curve whose +/- area errors cancel in the integral and
  # happens to match at x=0.97008. This floor adds a THIRD PASS condition:
  # every compared point at x >= 0.1 m must be within tolerance. 0.1 m is an
  # order of magnitude past NASA's documented LE exclusion (x<0.01) and ~4x
  # past the empirically-characterized near-LE formulation band (x<=0.023,
  # cycle-3g) — it is the genuinely developed turbulent BL, NOT a value tuned
  # to the failures. Only deviations BELOW 0.1 m are demotable to
  # known_deviations; an out-of-tolerance point at x>=0.1 m is a real FAIL.
  developed_region_min_m: 0.1
  notes: |
    NASA TMR canonical Cf curve (CFL3D, k-omega SST, on-plate region only).
    Re MATCHED (DEC-V61-209, 2026-05-27): nu = 6e-6 → Re/L = U/nu = 5e6 = NASA
    canonical. Mesh: NASA TMR topology — leading SYMMETRY section [-0.333,0]
    then no-slip PLATE [0,2], y+ ~ 1.3 avg. Freestream turbulence set to NASA
    SST values (Tu=0.039%, mu_t/mu=0.009; k=2.025e-4, omega=3750).
    GATED VERDICT (gate_mode: nasa_integrated) = PASS, validated. Integrated-Cf
    drag 0.83%, Cf@x=0.97008 1.28%, developed region (157 pts, x>=0.1) max 2.13%
    with 0 failures. 4 near-LE points in 0.0129 <= x <= 0.0232 over-predict Cf
    (worst 21.2% at x=0.0129) and are reported as known_deviations (below the
    0.1 developed-region floor). Under a naive per-point-from-x=0.01 gate those
    4 would FAIL — but that is NOT the authoritative convention: NASA TMR's own
    quantitative SST verification keys off integrated drag + a downstream station
    (both within tolerance here), and the developed-region guard confirms shape
    correctness away from the LE. The near-LE band survived correct Re + NASA
    topology + NASA freestream + y+~1 + a 180->260 grid-convergence probe (error
    grid-converged) — i.e. it is a near-LE OpenFOAM-kOmegaSST-vs-CFL3D
    formulation discrepancy, not a fixable setup error. The 0.10 tolerance
    reflects genuine discretization uncertainty, not a hidden Reynolds offset
    (prior nu=1.5e-5 gave 15-17%). See `reference/provenance.md` for full
    citation, license, and regeneration instructions.

required_artifacts:
  - geometry_report.json
  - mesh_report.json
  - bc_audit.json
  - solver.log
  - residuals.csv
  - qoi.csv
  - reference_comparison.csv
  - trust_report.json
