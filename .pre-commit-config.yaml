# Pre-commit hooks for cfd-harness-unified.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Authority: ADR-001 (four-plane import enforcement, static layer).
# The hook runs the full `.importlinter` contract — not just on staged
# files — because import-linter's dependency graph is repo-global.

repos:
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter · four-plane contract (ADR-001)
        entry: lint-imports
        # `language: python` + additional_dependencies makes the hook
        # self-contained — pre-commit creates an isolated venv with
        # import-linter installed, regardless of the dev shell's PATH.
        # Previously `language: system` required `lint-imports` to be
        # globally installed, which broke `pre-commit install` on
        # fresh dev environments.
        language: python
        # Pin to project Python (per pyproject.toml requires-python =
        # ">=3.12"). Per Codex audit on 0208929 (R1 LOW): without this
        # the hook env follows whatever interpreter launched pre-commit,
        # which can drift from the project runtime (verified locally
        # the hook passes from a Python 3.9 pre-commit env, but that
        # is fragile against future syntax-version regressions).
        language_version: python3.12
        additional_dependencies:
          - "import-linter>=2.0"
        pass_filenames: false
        # Per Codex G-5 round 1 Low #4: avoid running on docs-only commits.
        # The contract graph is repo-global so we can't use stale staged files,
        # but we can gate by file touch set — run only when code or contract
        # config actually changes.
        files: ^(src/.*\.py|\.importlinter|pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$

      # OPS-2026-04-25-001 dual-track isolation guard · RETIRED 2026-05-07
      # by DEC-V61-133 (B+ governance simplification). Reason: original
      # design protected parallel CORE-A vs CORE-B development; project
      # is now single-track main-line, so the [ops]/[shared]/[deps]/
      # [cross-track-ack] tagging requirement adds friction with no
      # corresponding protection. Scripts kept in tree (scripts/
      # check_track_isolation.py + ..._msg.py) so a future DEC can
      # re-enable if parallel-track work resumes.
      #
      # § 11.1 Workbench feature freeze advisory · RETIRED 2026-05-07
      # by DEC-V61-133. Reason: was already scheduled to retire
      # 2026-05-19; pulled forward by 12 days. Hook was advisory-only
      # (never blocked); script kept in tree at
      # tools/methodology_guards/workbench_freeze_advisory.sh.

      # Codex-verified cadence floor · THRESHOLD bumped 10 → 30 by
      # DEC-V61-133 (2026-05-07 B+ governance simplification). Risk-class
      # trigger logic unchanged (still fires on routes/**, pages/**,
      # security-path globs, LOC delta > 500). Override:
      # CODEX_CADENCE_OVERRIDE=1 git push (audited via env).
      # Install: pre-commit install --hook-type pre-push
      - id: codex-cadence
        name: Codex-verified cadence floor (DEC-V61-133 v2.3 · THRESHOLD=30)
        entry: python scripts/check_codex_cadence.py
        language: python
        language_version: python3.12
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # DEC-V61-132 N1.2 · AI dispatch path mutation grep lint (warning-only).
      # Behavioral test in tests/test_ai_advisor_contract.py is the merge
      # gate. This hook is fast feedback for staged AI dispatch files;
      # match → WARNING + exit 0. False-positives (deprecation comments
      # quoting symbols) are acceptable because the hook never blocks.
      # See DEC-V61-132 §3.3 for warning-only rationale.
      - id: ai-path-mutation-grep
        name: DEC-V61-132 · AI advisor mutation pattern (warning-only)
        entry: scripts/governance/check_ai_path_mutations.sh
        language: script
        files: ^(ui/backend/services/(ai_actions|llm_coach)/|ui/backend/routes/ai_.*\.py$)
        stages: [pre-commit]

      # M-DRIFT (advisor_substrate_arc · 2026-05-13) · Corpus drift-prevention.
      # Fails the commit if methodology file is staged without the runtime
      # advisor copy. Closes the gap that produced the V57→V84 27-row arrears
      # (Codex P2 on e56f160..e89a88f, synced 2026-05-13 in a0effac).
      # Bypass: `Corpus-sync-defer: <reason>` trailer (audited) or --no-verify.
      # Install: pre-commit install --hook-type commit-msg
      - id: corpus-sync
        name: Corpus drift-prevention (methodology ↔ runtime advisor)
        entry: python scripts/governance/check_corpus_sync.py
        language: python
        language_version: python3.12
        stages: [commit-msg]
        pass_filenames: true
        always_run: true

      # DEC-V61-203 (2026-05-25) · Frontend TypeScript build gate. A prior
      # session committed a RED `tsc -b` (TopBarV4 step-union error) that no
      # gate caught — it reached HEAD and surfaced a session later (M3.11).
      # This blocks an un-buildable frontend from being committed. Scoped to
      # frontend TS/TSX touches; pass_filenames:false because `tsc -b` is a
      # project-graph build, not a per-file check. Override:
      # SKIP=frontend-typecheck git commit ...  (or --no-verify).
      - id: frontend-typecheck
        name: frontend tsc -b build gate (DEC-V61-203)
        entry: scripts/governance/check_frontend_typecheck.sh
        language: script
        pass_filenames: false
        # Match TS/TSX sources AND the tsconfig*.json files that are part of
        # the `tsc -b` project graph — a config-only edit can break the build
        # too (Codex R0 P2). vite.config.ts is already covered by the .ts arm.
        files: ^ui/frontend/(.*\.(ts|tsx)|tsconfig[^/]*\.json)$
        stages: [pre-commit]
